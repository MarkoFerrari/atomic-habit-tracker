name: Deploy push function

# Builds, tests and deploys /function to Scaleway (Paris). Runs when the function changes on main,
# or by hand from the Actions tab. The Pages deploy runs after it, so the app picks up the function's URL.
on:
  push:
    branches: [main]
    paths: ['function/**', '.github/workflows/function.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-function
  cancel-in-progress: false

env:
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  SCW_DEFAULT_REGION: fr-par
  SCW_DEFAULT_ZONE: fr-par-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: function
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: function/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package
        run: cd dist && zip -q ../function.zip handler.js package.json
      - name: Install the Scaleway CLI
        run: curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh && scw version
      - name: Deploy to Scaleway
        run: bash deploy.sh function.zip
        env:
          ATOMIC_INVITE_CODE: ${{ secrets.ATOMIC_INVITE_CODE }}
          ATOMIC_APP_URL: https://markoferrari.github.io/atomic-habit-tracker/
