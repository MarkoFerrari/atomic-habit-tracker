name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # After the push function deploys, rebuild so the app knows its URL (first deploy, or if it ever moves).
  workflow_run:
    workflows: [Deploy push function]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed function deploy doesn't redeploy the app.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run check
      - run: npm test
      - run: npm run lint:tokens
      - name: Find the push function's URL
        id: push
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: |
          if [ -n "$SCW_ACCESS_KEY" ]; then
            curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh >/dev/null
            echo "url=$(bash function/push-url.sh)" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          VITE_PUSH_URL: ${{ steps.push.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
